<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社員詳細 - 簡易社員管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ensure editable fields are white */
        .form-control:not([readonly]) {
            background-color: #fff !important; 
        }
        /* Custom styling for invalid fields (Red border and thicker) */
        .form-control:invalid, 
        .form-control.is-invalid {
            border-color: #dc3545; 
            border-width: 2px !important; 
        }
        /* Custom styling for error message text */
        .invalid-feedback-custom {
            color: #dc3545; 
            font-size: 0.875em;
            margin-top: 0.25rem;
            display: none; /* Hidden by default */
        }
        /* Show error message when parent form is invalid */
        .was-validated .form-control:invalid + .invalid-feedback-custom {
            display: block; 
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand ms-2" href="#">簡易社員管理システム</a>
            <span class="navbar-text me-2">
                <a href="#" class="text-white text-decoration-none">ログアウト</a>
            </span>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-person-lines-fill me-2 text-primary" viewBox="0 0 16 16">
                    <path d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm11.5-9h-6a.5.5 0 0 0 0 1h6a.5.5 0 0 0 0-1m0 2h-6a.5.5 0 0 0 0 1h6a.5.5 0 0 0 0-1m0 2h-6a.5.5 0 0 0 0 1h6a.5.5 0 0 0 0-1"/>
                </svg>
                社員詳細
            </h4>
            <div>
                <button class="btn btn-outline-secondary me-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                    </svg>
                    戻る
                </button>
                <button class="btn btn-danger me-2" data-bs-toggle="modal" data-bs-target="#deleteConfirmationModal">削除</button>
                <button type="submit" form="employeeDetailForm" class="btn btn-primary" id="registerButton">登録</button>
            </div>
        </div>

        <form id="employeeDetailForm" class="card p-4 needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="employeeId" class="form-label">社員ID</label>
                    <input type="text" class="form-control" id="employeeId" value="0001" readonly>
                </div>
                <div class="col-md-3">
                    <label for="zipCode" class="form-label">郵便番号</label>
                    <input type="text" class="form-control" id="zipCode" placeholder="000-0000">
                </div>
                <div class="col-md-3">
                    <label class="form-label d-block">性別*</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="male" value="male" checked required>
                        <label class="form-check-label" for="male">男性</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                        <label class="form-check-label" for="female">女性</label>
                    </div>
                </div>
                <div class="col-md-3 text-end">
                    <div class="form-check mt-4">
                        <input class="form-check-input" type="checkbox" value="" id="retired">
                        <label class="form-check-label" for="retired">
                            退職済み*
                        </label>
                    </div>
                </div>

                <div class="col-md-3">
                    <label for="furigana" class="form-label">フリガナ</label>
                    <input type="text" class="form-control" id="furigana" placeholder="ヤマダ タロウ">
                </div>
                <div class="col-md-9">
                    <label for="address" class="form-label">住所</label>
                    <input type="text" class="form-control" id="address" placeholder="東京都港区...">
                </div>

                <div class="col-md-3">
                    <label for="name" class="form-label">氏名*</label>
                    <input type="text" class="form-control" id="name" placeholder="山田 太郎" required>
                    <div class="invalid-feedback-custom">このフィールドを入力してください。</div>
                </div>
                <div class="col-md-3">
                    <label for="phone" class="form-label">電話番号</label>
                    <input type="tel" class="form-control" id="phone" placeholder="090-XXXX-XXXX">
                </div>
                <div class="col-md-3">
                    <label for="department" class="form-label">所属</label>
                    <input type="text" class="form-control" id="department" placeholder="開発部">
                </div>
            </div>
        </form>
    </div>

    <div class="modal fade" id="registrationConfirmationModal" tabindex="-1" aria-labelledby="registrationConfirmationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title text-primary" id="registrationConfirmationModalLabel">登録確認</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-0">
                    <p>入力された内容を登録しますか?</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">はい</button>
                    <button type="button" class="btn btn-warning text-white px-4" data-bs-dismiss="modal">いいえ</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteConfirmationModal" tabindex="-1" aria-labelledby="deleteConfirmationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title text-primary" id="deleteConfirmationModalLabel">削除確認</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-0">
                    <p>選択された社員**宮崎 太郎**を削除しますか?</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">はい</button>
                    <button type="button" class="btn btn-warning text-white px-4" data-bs-dismiss="modal">いいえ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- Bootstrap Form Validation Logic ---
        (function () {
            'use strict'
            
            const form = document.getElementById('employeeDetailForm');

            // Handle the submission check
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    // Prevent form submission if validation fails
                    event.preventDefault();
                    event.stopPropagation();
                    // Show validation errors
                    form.classList.add('was-validated');
                } else {
                    // If validation passes, prevent standard submission 
                    // and trigger the modal instead (Image 7.png)
                    event.preventDefault();
                    event.stopPropagation();
                    
                    // Manually trigger the modal using Bootstrap's JS API
                    const modal = new bootstrap.Modal(document.getElementById('registrationConfirmationModal'));
                    modal.show();
                    
                    // Hide validation errors once form is valid
                    form.classList.remove('was-validated');
                }
            }, false);

        })();
    </script>
</body>
</html>
