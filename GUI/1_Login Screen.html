<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 簡易社員管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ensure editable fields are white */
        .form-control:not([readonly]) {
            background-color: #fff !important; 
        }
        /* Custom styling for invalid fields (Red border and thicker) */
        .form-control:invalid, 
        .form-control.is-invalid {
            border-color: #dc3545; 
            border-width: 2px !important; 
        }
        /* Custom styling for error message text */
        .invalid-feedback-custom {
            color: #dc3545; 
            font-size: 0.875em;
            margin-top: 0.25rem;
            display: none; /* Hidden by default */
        }
        /* Show error message when parent form is invalid */
        .was-validated .form-control:invalid + .invalid-feedback-custom,
        .was-validated .input-group > .form-control:invalid ~ .invalid-feedback-custom {
            display: block; 
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center" style="min-height: 100vh; background-color: #f8f9fa;">
    <div class="card p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h4 class="mb-3">簡易社員管理システム</h4>
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#0d6efd" class="bi bi-person-circle" viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.758 1.226 5.468 2.37A7 7 0 0 0 8 1"/>
            </svg>
            <h5 class="mt-3">ログイン</h5>
        </div>
        <form id="loginForm" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label small">メールアドレス</label>
                <input type="email" class="form-control" id="email" placeholder="メールアドレスを入力" required>
                <div class="invalid-feedback-custom">有効なメールアドレスを入力してください。</div>
            </div>
            
            <div class="mb-4">
                <label for="password_input" class="form-label small">パスワード</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password_input" required>
                    <button class="btn btn-outline-secondary password-toggle" type="button" data-target="password_input">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-fill eye-icon" viewBox="0 0 16 16">
                            <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                            <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
                        </svg>
                    </button>
                </div>
                <div class="invalid-feedback-custom">このフィールドを入力してください。</div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3 py-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-in-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0z"/>
                    <path fill-rule="evenodd" d="M10 8a.5.5 0 0 0-.5-.5H3.707l2.147-2.146a.5.5 0 1 0-.708-.708l-3 3a.5.5 0 0 0 0 .708l3 3a.5.5 0 0 0 .708-.708L3.707 8.5H9.5a.5.5 0 0 0 .5-.5"/>
                </svg>
                ログイン
            </button>
            <p class="text-center small">アカウントをまだ持っていませんか？ <a href="#">新規アカウント登録</a></p>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password Toggle Functionality
        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const targetInput = document.getElementById(targetId);
                const eyeIcon = button.querySelector('.bi');

                if (targetInput.type === 'password') {
                    targetInput.type = 'text';
                    eyeIcon.classList.remove('bi-eye-fill');
                    eyeIcon.classList.add('bi-eye-slash-fill');
                    eyeIcon.innerHTML = `<path d="M13.359 11.238C15.06 9.52 16 8 16 8s-3-5.5-8-5.5a7.02 7.02 0 0 0-2.79.588l.77.771A5.94 5.94 0 0 1 8 3.5c2.147 0 3.753 1.257 4.542 2.766a5.53 5.53 0 0 1 .462 1.096L13.359 11.238zm-4.706-4.298a2.5 2.5 0 1 1-3.129 3.129l-.793.793c-.55-1.111-.84-2.473-.84-3.922 0-3.084 3-5.5 8-5.5s8 2.416 8 5.5-3 5.5-8 5.5c-1.399 0-2.774-.216-4.009-.646l-.791-.791zM8 5.5a2.5 2.5 0 0 0-2.5 2.5a2.5 2.5 0 0 0 2.5 2.5a2.5 2.5 0 0 0 2.5-2.5A2.5 2.5 0 0 0 8 5.5z"/>`; 
                } else {
                    targetInput.type = 'password';
                    eyeIcon.classList.remove('bi-eye-slash-fill');
                    eyeIcon.classList.add('bi-eye-fill');
                    eyeIcon.innerHTML = `<path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/><path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>`; 
                }
            });
        });

        // --- Bootstrap Form Validation Logic ---
        (function () {
            'use strict'
            
            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            const form = document.getElementById('loginForm');
            
            // Loop over them and prevent submission
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                form.classList.add('was-validated');
            }, false);

        })();
    </script>
</body>
</html>
