<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N5 Master - Zen Study & Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f8fafc;
            --bg-card: #ffffff;
            --text: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --accent: #f59e0b;
            --font-main: 'Outfit', sans-serif;
            --font-jp: 'Noto Sans JP', sans-serif;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #334155;
            --secondary-bg: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        body { font-family: var(--font-main); background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- Header --- */
        .app-header {
            position: sticky; top: 0; z-index: 1000;
            background: var(--bg-card); border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow-sm);
        }
        .logo { font-weight: 600; font-size: 1.25rem; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .mode-switcher { display: flex; background: var(--bg); padding: 0.25rem; border-radius: 8px; border: 1px solid var(--border); }
        .mode-btn { 
            padding: 0.4rem 0.8rem; border-radius: 6px; border: none; font-weight: 500; font-size: 0.85rem; cursor: pointer;
            background: transparent; color: var(--text-sub);
        }
        .mode-btn.active { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-sm); }
        .header-controls { display: flex; gap: 1rem; align-items: center; }

        /* --- Global Layout --- */
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        button { cursor: pointer; font-family: inherit; }

        /* --- Zen Study Card --- */
        .zen-card {
            background: var(--bg-card); border-radius: 24px; padding: 3rem; text-align: center;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border); position: relative;
            transform: translateY(0); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .zen-card:hover { transform: translateY(-5px); }
        
        .svg-container { width: 150px; height: 150px; margin: 0 auto 1.5rem; background: var(--bg); border-radius: 50%; padding: 1rem; display: flex; align-items: center; justify-content: center; }
        .svg-container svg { width: 100%; height: 100%; }
        .svg-container path { stroke: var(--primary); fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

        .focal-point { font-size: 6rem; font-family: var(--font-jp); font-weight: 700; margin-bottom: 0.5rem; color: var(--text); }
        .focal-meaning { font-size: 1.5rem; color: var(--text-sub); margin-bottom: 2rem; }

        .nav-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; }
        .nav-btn { background: var(--bg); border: 1px solid var(--border); padding: 0.75rem 1.5rem; border-radius: 12px; font-weight: 600; color: var(--text); font-size: 1rem; }
        .nav-btn:hover { background: var(--border); }
        .counter { color: var(--text-sub); font-weight: 500; }

        .action-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
        .btn-primary { background: var(--primary); color: white; padding: 1rem; border-radius: 12px; border: none; font-weight: 600; font-size: 1rem; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--bg); color: var(--text); padding: 1rem; border-radius: 12px; border: 1px solid var(--border); font-weight: 600; font-size: 1rem; }

        /* --- Fullscreen Modal --- */
        .modal-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 2000;
            display: none; flex-direction: column; overflow-y: auto;
            animation: slideUp 0.4s ease-out; padding-bottom: 4rem;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header {
            padding: 1.5rem; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); background: var(--bg-card); sticky top: 0;
        }
        .close-btn { font-size: 1.5rem; padding: 0.5rem; border-radius: 50%; background: var(--bg); border: none; line-height: 1; }
        
        .modal-content { max-width: 900px; margin: 0 auto; width: 100%; padding: 2rem; display: grid; grid-template-columns: 1fr 1.5fr; gap: 3rem; }
        @media (max-width: 768px) { .modal-content { grid-template-columns: 1fr; } }

        .modal-left { text-align: center; }
        .flashcard-wrapper { 
            background: #fff; border-radius: 16px; padding: 1rem; box-shadow: var(--shadow-md); 
            cursor: zoom-in; position: relative; margin-bottom: 2rem;
        }
        .flashcard-img { width: 100%; border-radius: 8px; display: block; }
        .flashcard-wrapper.zoomed { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: 3000; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center;
            cursor: zoom-out; padding: 5vw; border-radius: 0; box-shadow: none;
        }
        .flashcard-wrapper.zoomed img { 
            max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 0; 
        }

        .section-title { font-size: 1rem; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .section-title::after { content: ''; flex-grow: 1; height: 1px; background: var(--border); }
        
        .reading-block { margin-bottom: 2rem; text-align: left; }
        .reading-chip { display: inline-block; background: var(--bg); padding: 0.5rem 1rem; border-radius: 8px; margin: 0.25rem; font-family: var(--font-jp); }
        .reading-chip b { color: var(--primary); margin-right: 0.5rem; }

        .example-list { display: flex; flex-direction: column; gap: 1rem; }
        .example-item { 
            background: var(--bg-card); padding: 1.25rem; border-radius: 16px; border: 1px solid var(--border); 
            box-shadow: var(--shadow-sm); text-align: left;
        }
        .example-jp { font-size: 1.25rem; font-family: var(--font-jp); margin-bottom: 0.5rem; line-height: 1.6; }
        .example-en { font-size: 0.95rem; color: var(--text-sub); }
        
        /* High-fidelity styling */
        .color { color: var(--danger); font-weight: 700; text-decoration: underline; }
        .furigana { color: var(--success); font-size: 0.8rem; vertical-align: super; }

        /* --- Game Mode --- */
        .game-overlay { 
            position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: none; flex-direction: column;
        }
        .quiz-header { padding: 1rem; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .streak-pill { background: var(--accent); color: white; padding: 0.25rem 0.75rem; border-radius: 20px; font-weight: 700; font-size: 0.9rem; }
        
        .quiz-body { flex-grow: 1; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .quiz-q-type { color: var(--primary); font-weight: 600; margin-bottom: 2rem; }
        .quiz-prompt { font-size: 4rem; font-family: var(--font-jp); margin-bottom: 3rem; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; width: 100%; max-width: 500px; }
        .option-btn { 
            padding: 1.5rem; background: var(--bg-card); border: 2px solid var(--border); border-radius: 16px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .option-btn:hover { border-color: var(--primary); background: var(--bg); }
        .option-btn.correct { background: var(--success); border-color: var(--success); color: white; }
        .option-btn.wrong { background: var(--danger); border-color: var(--danger); color: white; }

        /* --- Footer Nav & Settings --- */
        .bottom-nav { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1rem; }
        .utility-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        /* --- Jump-To & Toggles --- */
        .jump-box { display: flex; align-items: center; gap: 0.5rem; background: var(--bg); padding: 0.25rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); }
        .jump-input { width: 40px; border: none; background: transparent; font-weight: 600; text-align: center; font-size: 0.9rem; -moz-appearance: textfield; }
        .jump-input::-webkit-outer-spin-button, .jump-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .toggle-switch { position: relative; width: 44px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #cbd5e1; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- Utility UI --- */
        .hidden { display: none !important; }
        .loading-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Animation */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="loader" class="loading-screen">
        <div class="spinner"></div>
        <div style="font-weight: 600; color: var(--text-sub)">Loading Master Data...</div>
    </div>

    <!-- Header -->
    <header class="app-header">
        <div class="logo" onclick="location.reload()">
            <span>🎌</span>
            <span id="title-text">N5 Master</span>
        </div>

        <div class="mode-switcher">
            <button id="mode-kanji" class="mode-btn active" onclick="setMode('kanji')">Kanji</button>
            <button id="mode-vocab" class="mode-btn" onclick="setMode('vocab')">Vocab</button>
        </div>

        <div class="header-controls">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span style="font-size: 0.8rem; font-weight: 600; color: var(--text-sub)">AUTO REVEAL</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="auto-reveal" checked onchange="toggleAutoReveal()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="jump-box">
                <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-sub)">K-</span>
                <input type="number" id="jump-id" class="jump-input" placeholder="01" onkeydown="handleJump(event)">
            </div>
            <button class="utility-btn" onclick="toggleTheme()" title="Toggle Dark Mode">🌓</button>
        </div>
    </header>

    <main class="container">
        <!-- Zen Card -->
        <div id="zen-card" class="zen-card fade-in">
            <div id="svg-box" class="svg-container">
                <!-- SVG Injected -->
            </div>
            <div id="main-display" class="focal-point">日</div>
            <div id="main-meaning" class="focal-meaning">Sun, Day</div>

            <div class="nav-controls">
                <button class="nav-btn" onclick="nav(-1)">←</button>
                <div id="counter" class="counter">01 / 80</div>
                <button class="nav-btn" onclick="nav(1)">→</button>
            </div>

            <div class="action-bar">
                <button class="btn-primary" onclick="openModal()">📖 Study Deeply</button>
                <button class="btn-secondary" onclick="startQuiz()">🎮 Play Quiz</button>
            </div>
        </div>
    </main>

    <!-- Detailed Modal -->
    <div id="modal" class="modal-overlay">
        <div class="modal-header">
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div id="modal-char" style="font-size: 1.5rem; font-family: var(--font-jp); font-weight: 700;">日</div>
                <div id="modal-meaning-header" style="color: var(--text-sub); font-weight: 600;">Sun, Day</div>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button class="nav-btn" style="padding: 0.5rem 1rem;" onclick="nav(-1)">←</button>
                <button class="nav-btn" style="padding: 0.5rem 1rem;" onclick="nav(1)">→</button>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
        </div>

        <div class="modal-content">
            <div class="modal-left">
                <div id="flashcard-box" class="flashcard-wrapper" onclick="this.classList.toggle('zoomed')">
                    <img id="flash-img" src="" alt="Flashcard Mnemonic" class="flashcard-img">
                </div>
                
                <div id="modal-svg-large" class="svg-container" style="width: 200px; height: 200px; background: var(--bg-card); border: 1px solid var(--border)">
                    <!-- SVG -->
                </div>
                <p style="font-size: 0.8rem; color: var(--text-sub); margin-top: 1rem;">Stroke Order Diagram</p>
            </div>

            <div class="modal-right">
                <div id="readings-section">
                    <h3 class="section-title">Readings & Vocabulary</h3>
                    <div id="readings-list" class="reading-block">
                        <!-- Injected -->
                    </div>
                </div>

                <div>
                    <h3 class="section-title">Example Sentences</h3>
                    <div id="examples-list" class="example-list">
                        <!-- Injected -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quiz Engine -->
    <div id="quiz-ui" class="game-overlay">
        <div class="quiz-header">
            <button class="nav-btn" style="padding: 0.4rem 0.8rem;" onclick="endQuiz()">Exit</button>
            <div style="display: flex; gap: 1rem;">
                <div class="streak-pill">🔥 Streak: <span id="streak-val">0</span></div>
                <div class="streak-pill" style="background: var(--primary)">⭐ Best: <span id="best-streak">0</span></div>
            </div>
        </div>
        <div class="quiz-body">
            <div id="quiz-type" class="quiz-q-type">MEANING QUIZ</div>
            <div id="quiz-prompt" class="quiz-prompt">日</div>
            <div id="quiz-options" class="options-grid">
                <!-- Options -->
            </div>
        </div>
    </div>

    <script>
        const AppState = {
            mode: 'kanji', // 'kanji' or 'vocab'
            kanjiData: [],
            vocabData: [],
            currentIndex: 0,
            autoReveal: true,
            quiz: {
                streak: 0,
                bestStreak: parseInt(localStorage.getItem('jlpt_best_streak')) || 0
            }
        };

        // --- Data Loading ---
        async function loadContent() {
            try {
                // Parallel fetching
                const [kanjiRes, vocabRes] = await Promise.all([
                    fetch('jlpt_n5_complete_kanji.json'),
                    fetch('jlpt_n5_vocab_complete.json')
                ]);

                const kanjiJson = await kanjiRes.json();
                const vocabJson = await vocabRes.json();

                AppState.kanjiData = kanjiJson.kanji || [];
                AppState.vocabData = vocabJson.vocab_data || [];

                document.getElementById('loader').classList.add('hidden');
                init();
            } catch (e) {
                console.error("Data load error:", e);
                alert("Critical Error: Could not load JSON data files.");
            }
        }

        function init() {
            updateUI();
            document.getElementById('best-streak').textContent = AppState.quiz.bestStreak;
        }

        // --- Core Logic ---
        function setMode(mode) {
            AppState.mode = mode;
            AppState.currentIndex = 0;
            
            document.getElementById('mode-kanji').classList.toggle('active', mode === 'kanji');
            document.getElementById('mode-vocab').classList.toggle('active', mode === 'vocab');
            document.getElementById('title-text').textContent = mode === 'kanji' ? 'Kanji Master' : 'Vocab Master';
            
            updateUI();
        }

        function updateUI() {
            const data = AppState.mode === 'kanji' ? AppState.kanjiData : AppState.vocabData;
            const entry = data[AppState.currentIndex];
            if (!entry) return;

            // Zen Card
            const display = AppState.mode === 'kanji' ? entry.character : entry.vocabulary_japanese;
            const meaning = AppState.mode === 'kanji' ? entry.meaning : entry.meaning;
            
            document.getElementById('main-display').textContent = display;
            document.getElementById('main-meaning').textContent = meaning;
            document.getElementById('counter').textContent = `${AppState.currentIndex + 1} / ${data.length}`;
            
            // SVG Injection
            const svgBox = document.getElementById('svg-box');
            if (AppState.mode === 'kanji' && entry.stroke_diagram_svg) {
                svgBox.innerHTML = entry.stroke_diagram_svg;
                const svg = svgBox.querySelector('svg');
                if (svg) {
                    svg.setAttribute('viewBox', '0 0 512 512'); // Force normalize
                    svg.style.width = '100%';
                    svg.style.height = '100%';
                    svg.querySelectorAll('path').forEach(p => p.setAttribute('stroke', 'var(--primary)'));
                }
            } else {
                svgBox.innerHTML = `<span style="font-size: 3rem; opacity: 0.3">${AppState.mode === 'kanji' ? '?' : '📚'}</span>`;
            }

            // Sync Modal
            updateModalUI(entry);
        }

        function nav(dir) {
            const data = AppState.mode === 'kanji' ? AppState.kanjiData : AppState.vocabData;
            AppState.currentIndex = (AppState.currentIndex + dir + data.length) % data.length;
            updateUI();
            
            // Auto open if reveal is on
            if (AppState.autoReveal && document.getElementById('modal').style.display === 'none') {
                // optionally auto-open? maybe not. 
            }
        }

        function handleJump(e) {
            if (e.key === 'Enter') {
                const val = parseInt(e.target.value) - 1;
                const data = AppState.mode === 'kanji' ? AppState.kanjiData : AppState.vocabData;
                if (val >= 0 && val < data.length) {
                    AppState.currentIndex = val;
                    updateUI();
                    e.target.blur();
                }
            }
        }

        // --- Modal Logic ---
        function openModal() {
            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            updateModalUI();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('flashcard-box').classList.remove('zoomed');
        }

        function updateModalUI() {
            const data = AppState.mode === 'kanji' ? AppState.kanjiData : AppState.vocabData;
            const entry = data[AppState.currentIndex];
            if (!entry) return;

            document.getElementById('modal-char').textContent = AppState.mode === 'kanji' ? entry.character : entry.vocabulary_japanese;
            document.getElementById('modal-meaning-header').textContent = entry.meaning;
            
            // Flashcard
            const img = document.getElementById('flash-img');
            if (entry.flashcard_url) {
                img.src = entry.flashcard_url;
                document.getElementById('flashcard-box').style.display = 'block';
            } else {
                document.getElementById('flashcard-box').style.display = 'none';
            }

            // SVG
            const svgLarge = document.getElementById('modal-svg-large');
            if (AppState.mode === 'kanji' && entry.stroke_diagram_svg) {
                svgLarge.innerHTML = entry.stroke_diagram_svg;
                svgLarge.style.display = 'flex';
            } else {
                svgLarge.style.display = 'none';
            }

            // Readings
            const rList = document.getElementById('readings-list');
            rList.innerHTML = '';
            
            if (AppState.mode === 'kanji' && entry.readings) {
                for (const [type, items] of Object.entries(entry.readings)) {
                    if (items.length > 0) {
                        const div = document.createElement('div');
                        div.innerHTML = `<div style="font-weight:700; color:var(--primary); margin-top:0.5rem; text-transform:capitalize;">${type}</div>`;
                        div.innerHTML += items.map(i => `<span class="reading-chip"><b>${i.word || ''}</b> ${i.reading}</span>`).join('');
                        rList.appendChild(div);
                    }
                }
            } else {
                // Vocab simple display
                const details = [
                    { label: 'Reading', value: entry.furigana || entry.vocabulary_english },
                    { label: 'Type', value: entry.type },
                    { label: 'Romaji', value: entry.romaji }
                ];
                details.forEach(d => {
                    if (d.value) {
                        const div = document.createElement('div');
                        div.innerHTML = `<div style="font-weight:700; color:var(--primary); margin-top:0.5rem;">${d.label}</div><div style="font-size:1.1rem; padding-left:0.5rem;">${d.value}</div>`;
                        rList.appendChild(div);
                    }
                });
            }

            // Examples
            const eList = document.getElementById('examples-list');
            eList.innerHTML = (entry.examples || []).map(ex => `
                <div class="example-item fade-in">
                    <div class="example-jp">${ex.japanese_html || ex.japanese_text}</div>
                    <div class="example-en">${ex.english}</div>
                </div>
            `).join('');
        }

        // --- Quiz Engine ---
        function startQuiz() {
            document.getElementById('quiz-ui').style.display = 'flex';
            AppState.quiz.streak = 0;
            updateStreakDisplay();
            generateQuestion();
        }

        function endQuiz() {
            document.getElementById('quiz-ui').style.display = 'none';
        }

        function generateQuestion() {
            const data = AppState.mode === 'kanji' ? AppState.kanjiData : AppState.vocabData;
            const target = data[Math.floor(Math.random() * data.length)];
            
            // Pick Type
            const types = ['reading', 'meaning', 'context'];
            const qType = types[Math.floor(Math.random() * types.length)];
            
            let prompt = "";
            let correct = "";
            let options = [];

            if (qType === 'reading') {
                document.getElementById('quiz-type').textContent = 'READING QUIZ';
                prompt = AppState.mode === 'kanji' ? target.character : target.vocabulary_japanese;
                
                if (AppState.mode === 'kanji') {
                    const allR = [...target.readings.onyomi, ...target.readings.kunyomi];
                    correct = allR.length > 0 ? allR[0].reading : 'None';
                } else {
                    correct = target.furigana || 'None';
                }
            } 
            else if (qType === 'meaning') {
                document.getElementById('quiz-type').textContent = 'MEANING QUIZ';
                prompt = AppState.mode === 'kanji' ? target.character : target.vocabulary_japanese;
                correct = target.meaning.split(',')[0].trim();
            } 
            else {
                document.getElementById('quiz-type').textContent = 'CONTEXT QUIZ';
                if (target.examples && target.examples.length > 0) {
                    const ex = target.examples[0];
                    const word = AppState.mode === 'kanji' ? target.character : target.vocabulary_japanese;
                    prompt = ex.japanese_text.replace(word, " [ ___ ] ");
                    correct = word;
                } else {
                    // Fallback to meaning if no examples
                    document.getElementById('quiz-type').textContent = 'MEANING QUIZ';
                    prompt = AppState.mode === 'kanji' ? target.character : target.vocabulary_japanese;
                    correct = target.meaning.split(',')[0].trim();
                }
            }

            document.getElementById('quiz-prompt').textContent = prompt;
            document.getElementById('quiz-prompt').style.fontSize = qType === 'context' ? '1.8rem' : '4rem';

            // Distinct options
            options.push(correct);
            while (options.length < 4) {
                const cand = data[Math.floor(Math.random() * data.length)];
                let val = "";
                if (qType === 'reading') {
                   if (AppState.mode === 'kanji') {
                        const allR = [...cand.readings.onyomi, ...cand.readings.kunyomi];
                        val = allR.length > 0 ? allR[0].reading : '';
                    } else {
                        val = cand.furigana;
                    }
                } else if (qType === 'meaning') {
                    val = cand.meaning.split(',')[0].trim();
                } else {
                    val = AppState.mode === 'kanji' ? cand.character : cand.vocabulary_japanese;
                }
                
                if (val && !options.includes(val)) options.push(val);
            }

            // Shuffle
            options.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('quiz-options');
            grid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(opt === correct, btn);
                grid.appendChild(btn);
            });
        }

        async function handleAnswer(isCorrect, btn) {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                AppState.quiz.streak++;
                if (AppState.quiz.streak > AppState.quiz.bestStreak) {
                    AppState.quiz.bestStreak = AppState.quiz.streak;
                    localStorage.setItem('jlpt_best_streak', AppState.quiz.bestStreak);
                }
                updateStreakDisplay();
                setTimeout(generateQuestion, 800);
            } else {
                btn.classList.add('wrong');
                // Perma death
                setTimeout(() => {
                    alert(`💥 WRONG! Correct was: ${document.querySelector('.option-btn:not(.wrong)').textContent}\nStreak reset to 0.`);
                    AppState.quiz.streak = 0;
                    updateStreakDisplay();
                    generateQuestion();
                }, 100);
            }
        }

        function updateStreakDisplay() {
            document.getElementById('streak-val').textContent = AppState.quiz.streak;
            document.getElementById('best-streak').textContent = AppState.quiz.bestStreak;
        }

        // --- Utils ---
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }

        function toggleAutoReveal() {
            AppState.autoReveal = document.getElementById('auto-reveal').checked;
        }

        // Start
        loadContent();

    </script>
</body>
</html>
